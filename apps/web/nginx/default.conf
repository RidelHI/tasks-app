# Serves the Angular app and forwards /api to the API, so the browser sees a single origin
# (the API keeps CORS off). Static responses get the security headers below; API responses
# keep the API's own headers (its deny-all CSP, Swagger UI's CSP, rate limit headers).

# One JSON line per request, like the API's logs; requestId is also sent to the API, so a request
# can be followed from nginx to the API.
log_format json escape=json
  '{"time":"$time_iso8601","requestId":"$request_id","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"durationSeconds":$request_time,"remoteAddr":"$remote_addr","userAgent":"$http_user_agent"}';

# Docker's DNS: the API's address is looked up again when it changes (e.g. the container is
# recreated), instead of only once at startup.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
  zone api 64k;
  server api:3000 resolve;
  keepalive 8;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  access_log /dev/stdout json;
  server_tokens off;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/css application/javascript image/svg+xml application/json
    application/problem+json;

  # Container health check (compose.yaml).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # The API. `^~`: the regex locations below never apply here (Swagger UI serves .js and .css).
  location ^~ /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The API trusts one proxy (TRUST_PROXY_HOPS=1): the last address, added here, is the client.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replaces any id sent by the client.
    proxy_set_header X-Request-Id $request_id;
  }

  # The app's page. A new CSP nonce per response: it replaces the CSP_NONCE placeholder that
  # Angular put on its <style> and <script> tags, and goes in the header. The page is never
  # stored, so a cached copy can never carry an old nonce.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    etag off;
    sub_filter_once off;
    sub_filter "CSP_NONCE" "$request_id";
  }

  # Build output with a content hash in its name (main-OKIXNUUB.js, media/*-3ZSHNGCF.woff2): a
  # new version gets a new name, so it can be cached for good.
  location ~* "-[a-z0-9]{8}\.(?:js|css|woff2)$" {
    include /etc/nginx/snippets/security-headers.conf;
    # Without `always`: an error (e.g. a 404) is not cached.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Other files (favicon, icons): their names do not change, so they are revalidated hourly.
  # A missing file is a 404, not the app.
  location ~* "\.[a-z0-9]+$" {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # App routes (/tasks?status=done, ...): the page itself, so deep links and reloads work.
  location / {
    try_files $uri /index.html;
  }
}
